  <style>
    :root {
      --bg: #08111f;
      --panel: #0e1b2d;
      --line: #22344b;
      --text: #edf3f8;
      --muted: #9eafc2;
      --accent: #b9d4e8;
      --button: #dbeaf4;

    * {

    html {
      scroll-behavior: smooth;
    }

      background:

        var(--bg);
      color: var(--text);
      font-family: Inter, Arial, Helvetica, sans-serif;
      line-height: 1.6;
    }

    .wrap {
      width: min(960px, calc(100% - 40px));
      margin: auto;
    }

    header {
      position: relative;
      z-index: 10;
      padding: 28px 0 20px;
      border-bottom: 1px solid var(--line);

      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-logo {
      width: 32px;
      height: 32px;
      color: var(--accent);
      flex-shrink: 0;
    }

    .brand {
      letter-spacing: .24em;
      font-size: 1.15rem;
      font-weight: 700;
    }

    .brand-sub {
      color: var(--muted);
      font-size: .78rem;
      margin-top: 6px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .hero {
      position: relative;
      min-height: 530px;
      display: flex;
      align-items: center;
      overflow: hidden;

      isolation: isolate;
    }
